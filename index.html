    <meta name="color-scheme" content="light dark" />

    <meta name="theme-color" content="#09314F" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Arete</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong palette.
      // Mirrors the persisted setting written by src/storage; falls back to the OS preference.
      try {
        var stored = localStorage.getItem('alts-academy:theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
      } catch (_) {
        /* localStorage unavailable (private mode) — the light default in the class attribute stands */
      }
    </script>
